name: dependency-security

on:
  push:
    paths:
      - "requirements.txt"
      - "requirements.in"
      - "sbom/**"
      - ".github/workflows/deps.yml"
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit hashed lockfile
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Produce CycloneDX SBOM
        if: always()
        run: |
          mkdir -p sbom
          pip-audit -r requirements.txt --progress-spinner off --format cyclonedx-json -o sbom/cyclonedx-ci.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cyclonedx-sbom
          path: sbom/cyclonedx-ci.json
          if-no-files-found: ignore
